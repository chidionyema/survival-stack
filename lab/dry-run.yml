# The estate, faked, for nothing. MinIO stands in for R2, containers stand in
# for VMs, Caddy stands in for the proxied apex A record. The control plane is
# the real Worker under `wrangler dev` on the host. Nothing simulates it.
#
# There are no primary or standby services here on purpose. Boxes are created
# by the Worker through the docker provider driver, which is the code path the
# dry run exists to prove.
name: lab

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set lab http://minio:9000 admin password123 &&
             mc mb --ignore-existing lab/prospector &&
             echo bucket ready"

  edge:
    image: caddy:2-alpine
    ports: ["8080:80"]
    volumes: ["./state/Caddyfile:/etc/caddy/Caddyfile:ro"]

  # Test D only. `--profile postgres` brings these up.
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: labpass
      POSTGRES_DB: app
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  minio-data:
